<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Panel de control de Gadgets Navideños">
		<link rel="stylesheet" href="style.css">
		<title>Panel de Control</title>
	</head>
	<body>
		<canvas id="snow" aria-hidden="true"></canvas>

		<header id="titlebar" data-tauri-drag-region="deep">
			<div id="brand">
				<img id="brand-icon" src="icon.png" alt="">
				<div id="brand-text">
					<h1>Gadgets Navideños</h1>
					<span>Panel de Control</span>
				</div>
			</div>

			<div id="window-controls">
				<button class="win-btn close" id="close-btn" aria-label="Cerrar">×</button>
			</div>
		</header>

		<div id="main">
			<aside id="sidebar">
				<div id="search-wrap">
					<input id="search" type="search" placeholder="Buscar gadget..." autocomplete="off" spellcheck="false">
				</div>
				<div id="gadget-list"></div>
				<p id="list-empty" hidden>Sin resultados</p>
			</aside>

			<section id="configArea" role="main"></section>
		</div>

		<script src="control.js"></script>
	</body>

</html>
