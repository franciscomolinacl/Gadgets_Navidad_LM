<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<title>Termometro</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div class="card">
			<div class="title">Termometro</div>
			<div class="thermo">
				<div class="tube">
					<div class="mercury" id="mercury"></div>
					<div class="target" title="Navidad"></div>
				</div>
				<div class="ticks"></div>
				<div class="bulb">
					<div class="bulb-glass"></div>
				</div>
			</div>
			<div class="readout">
				<span class="days" id="days">--</span>
				<span class="unit" id="unit">dias</span>
			</div>
			<div class="caption" id="caption">para Navidad</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
