<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<title>CPU & RAM</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div id="container" role="main">
			<div class="row">
				<span class="label cpu">CPU</span>
				<canvas class="spark" id="cpuSpark" width="240" height="52"></canvas>
				<span class="value" id="cpuValue">--%</span>
			</div>

			<div class="row">
				<span class="label ram">RAM</span>
				<canvas class="spark" id="ramSpark" width="240" height="52"></canvas>
				<span class="value" id="ramValue">--%</span>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
