<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>CPU & RAM</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div id="container">
			<div class="section">
				<div class="label">CPU</div>
				<div class="bar"><div class="fill" id="cpuFill"></div></div>
				<div class="value" id="cpuValue">0%</div>
			</div>

			<div class="section">
				<div class="label">RAM</div>
				<div class="bar"><div class="fill" id="ramFill"></div></div>
				<div class="value" id="ramValue">0%</div>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
