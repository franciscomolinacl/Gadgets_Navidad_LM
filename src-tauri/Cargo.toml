[package]
name = "dwalm-gadgets-tauri"
version = "2.0.0"
edition = "2021"
description = "DWALM Gadgets Xmas — gadgets navideños para el escritorio (Tauri)"
authors = ["Francisco Molina <contacto@franciscomolina.cl>"]
license = "MIT"

[[bin]]
name = "dwalm-gadgets-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
